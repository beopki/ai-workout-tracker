
<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Workout Tracker Online</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/catalog.js"></script><script src="js/database.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f2f7;margin:0;color:#1c1c1e}
main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:14px;margin:11px 0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tabs button,.btn{border:0;border-radius:11px;padding:12px;font-weight:700}
.tabs button.on,.btn{background:#007aff;color:white}.exercise.done{background:#eaf8ee;border:2px solid #34c759}
.exercise{background:#fff;border-radius:16px;padding:14px;margin:11px 0;border:2px solid transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.field{background:#f7f7f8;border-radius:10px;padding:9px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;font-size:17px}.weight{display:flex;gap:5px;align-items:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.secondary{background:#e5e5ea;color:#1c1c1e}
.progress{height:14px;background:#ddd;border-radius:9px;overflow:hidden}.bar{height:100%;background:#34c759;width:0}
.status{font-size:12px;color:#6e6e73;margin-bottom:10px}.page{display:none}.page.on{display:block}

.topnav{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.topnav button{
  border:0;
  border-radius:11px;
  padding:12px;
  font-weight:700;
  background:#e5e5ea;
  color:#1c1c1e;
}

.topnav button.on{
  background:#007aff;
  color:#fff;
}

.metric-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.metric{
  margin-top:10px;
}

.metric label{
  display:block;
  margin-bottom:5px;
  font-size:14px;
  font-weight:700;
}

.body-summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.summary-item{
  background:#f2f2f7;
  border-radius:12px;
  padding:10px;
  text-align:center;
}

.summary-item small{
  display:block;
  color:#6e6e73;
  margin-bottom:4px;
}

.body-record{
  background:#fff;
  border-radius:14px;
  padding:13px;
  margin:10px 0;
  border:1px solid #e5e5ea;
}

.record-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

@media(max-width:390px){
  .row{grid-template-columns:1fr}
  .metric-grid{grid-template-columns:1fr}
  .body-summary{grid-template-columns:1fr}
}
</style></head><body><main>
<h1>AI Workout Tracker</h1><div id="status" class="status">온라인 연결 중…</div>

<section class="card" id="emailLinkCard">
  <h2>이메일 연결</h2>

  <p style="color:#6e6e73;font-size:14px;line-height:1.5">
    현재 운동 기록을 다른 기기에서도 사용하려면 이메일을 연결하세요.
  </p>

  <input
    id="linkEmailInput"
    type="email"
    placeholder="이메일 주소"
    autocomplete="email"
  >

  <button
    id="linkEmailButton"
    class="btn"
    style="width:100%;margin-top:10px"
  >
    이메일 연결
  </button>

  <div
    id="emailLinkStatus"
    style="margin-top:10px;font-size:13px;color:#6e6e73"
  ></div>
</section>  
  <section class="card">
  <div class="topnav">
    <button id="workoutNav" class="on">운동 기록</button>
    <button id="bodyNav">인바디 기록</button>
  </div>
</section>
<section id="home" class="page on">
<div class="card"><h2 id="mission"></h2><div id="sub"></div></div>
<div class="card"><div id="tabs" class="tabs"></div></div>
<div class="card"><div id="preview"></div><button id="start" class="btn" style="width:100%;margin-top:10px">운동 시작</button></div>
</section>

<section id="workout" class="page">
<div class="card"><h2 id="title"></h2><div class="progress"><div id="bar" class="bar"></div></div><div id="count"></div></div>
<div id="list"></div>
<div class="card"><label>운동시간</label><div class="weight"><input id="duration" type="number" value="40"><span>분</span></div>
<label>메모</label><input id="memo"><button id="finish" class="btn" style="width:100%;margin-top:10px">운동 종료</button></div>
</section>

<section id="result" class="page"><div class="card"><h2>오늘의 성장</h2><div id="results"></div></div><button id="back" class="btn" style="width:100%">완료</button></section>
<section id="bodyPage" class="page">

  <div class="card">
    <h2>인바디 기록</h2>

    <p style="color:#6e6e73;font-size:14px;line-height:1.5">
      측정 결과를 입력하면 직전 기록과 최초 기록 대비 변화를 확인할 수 있습니다.
    </p>

    <div class="metric">
      <label for="bodyDate">측정일</label>
      <input id="bodyDate" type="date">
    </div>

    <div class="metric-grid">

      <div class="metric">
        <label for="bodyWeight">체중 (kg) *</label>
        <input
          id="bodyWeight"
          type="number"
          step="0.1"
          inputmode="decimal"
          placeholder="예: 59.6"
        >
      </div>

      <div class="metric">
        <label for="bodyMuscle">골격근량 (kg)</label>
        <input
          id="bodyMuscle"
          type="number"
          step="0.1"
          inputmode="decimal"
          placeholder="예: 27.6"
        >
      </div>

      <div class="metric">
        <label for="bodyFatPercent">체지방률 (%)</label>
        <input
          id="bodyFatPercent"
          type="number"
          step="0.1"
          inputmode="decimal"
          placeholder="예: 16.6"
        >
      </div>

      <div class="metric">
        <label for="bodyFatMass">체지방량 (kg)</label>
        <input
          id="bodyFatMass"
          type="number"
          step="0.1"
          inputmode="decimal"
          placeholder="선택 입력"
        >
      </div>

      <div class="metric">
        <label for="bodyBmi">BMI</label>
        <input
          id="bodyBmi"
          type="number"
          step="0.1"
          inputmode="decimal"
          placeholder="선택 입력"
        >
      </div>

      <div class="metric">
        <label for="bodyVisceralFat">내장지방 레벨</label>
        <input
          id="bodyVisceralFat"
          type="number"
          step="1"
          inputmode="numeric"
          placeholder="선택 입력"
        >
      </div>

      <div class="metric">
        <label for="bodyWaistHip">복부지방률</label>
        <input
          id="bodyWaistHip"
          type="number"
          step="0.01"
          inputmode="decimal"
          placeholder="선택 입력"
        >
      </div>

    </div>

    <div class="metric">
      <label for="bodyMemo">메모</label>
      <input
        id="bodyMemo"
        type="text"
        placeholder="측정 장소, 운동 상태 등"
      >
    </div>

    <button
      id="saveBody"
      class="btn"
      style="width:100%;margin-top:14px"
    >
      인바디 기록 저장
    </button>

    <button
      id="cancelBodyEdit"
      class="secondary"
      style="display:none;width:100%;border:0;border-radius:11px;padding:12px;font-weight:700;margin-top:8px"
    >
      수정 취소
    </button>

    <div
      id="bodySaveStatus"
      style="margin-top:10px;font-size:13px;color:#6e6e73"
    ></div>
  </div>

  <div class="card">
    <h2>현재 변화</h2>

    <div id="bodySummary" class="body-summary">
      <div class="summary-item">
        <small>현재 체중</small>
        <strong>-</strong>
      </div>

      <div class="summary-item">
        <small>골격근량</small>
        <strong>-</strong>
      </div>

      <div class="summary-item">
        <small>체지방률</small>
        <strong>-</strong>
      </div>
    </div>

    <div
      id="bodyChanges"
      style="margin-top:12px;line-height:1.7"
    >
      아직 저장된 기록이 없습니다.
    </div>
  </div>

  <div class="card">
    <h2>목표 체중 68kg</h2>

    <div class="progress">
      <div id="bodyGoalBar" class="bar"></div>
    </div>

    <div
      id="bodyGoalText"
      style="margin-top:8px;color:#6e6e73"
    >
      기록을 입력하면 목표 진행률이 표시됩니다.
    </div>
  </div>

  <div class="card">
    <h2>측정 기록</h2>

    <div id="bodyRecordList">
      저장된 기록이 없습니다.
    </div>
  </div>

</section>
<script>
let selected=1,draft,previous={},timer,bodyRecords=[];
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}
function renderHome(){
  $('tabs').innerHTML='';
  [1,2,3,4].forEach(d=>{const b=document.createElement('button');b.textContent='Day '+d;b.className=d===selected?'on':'';b.onclick=()=>{selected=d;renderHome()};$('tabs').appendChild(b)});
  const info = WORKOUT_DAY_INFO[selected];

$('mission').textContent = info.title;

$('sub').textContent =
  `${info.subtitle} · ${WORKOUT_CATALOG[selected].length}개 운동 · 약 ${info.minutes}분`;
  $('preview').innerHTML=WORKOUT_CATALOG[selected].map((x,i)=>`<div style="padding:6px 0">${i+1}. ${x}</div>`).join('');
}
  function localToday(){
  const now=new Date();
  const local=new Date(now.getTime()-now.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}

function bodyValue(id){
  return $(id).value.trim();
}

function displayNumber(value,digits=1){
  if(value===null||value===undefined||value==='') return '-';
  return Number(value).toFixed(digits);
}

function changeText(current,base,unit){
  if(
    current===null||current===undefined||
    base===null||base===undefined
  ){
    return '-';
  }

  const difference=Number(current)-Number(base);
  const sign=difference>0?'+':'';

  return `${sign}${difference.toFixed(1)}${unit}`;
}

function escapeHtml(value){
  return String(value??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function resetBodyForm(){
  $('bodyDate').value=localToday();
  $('bodyWeight').value='';
  $('bodyMuscle').value='';
  $('bodyFatPercent').value='';
  $('bodyFatMass').value='';
  $('bodyBmi').value='';
  $('bodyVisceralFat').value='';
  $('bodyWaistHip').value='';
  $('bodyMemo').value='';

  $('saveBody').textContent='인바디 기록 저장';
  $('cancelBodyEdit').style.display='none';
}

function fillBodyForm(record){
  $('bodyDate').value=record.measured_date;
  $('bodyWeight').value=record.weight_kg??'';
  $('bodyMuscle').value=record.skeletal_muscle_kg??'';
  $('bodyFatPercent').value=record.body_fat_percent??'';
  $('bodyFatMass').value=record.body_fat_mass_kg??'';
  $('bodyBmi').value=record.bmi??'';
  $('bodyVisceralFat').value=record.visceral_fat_level??'';
  $('bodyWaistHip').value=record.waist_hip_ratio??'';
  $('bodyMemo').value=record.memo??'';

  $('saveBody').textContent='인바디 기록 수정';
  $('cancelBodyEdit').style.display='block';

  window.scrollTo({
    top:$('bodyPage').offsetTop,
    behavior:'smooth'
  });
}

function renderBodyRecords(){
  const list=$('bodyRecordList');

  if(!bodyRecords.length){
    list.textContent='저장된 기록이 없습니다.';

    $('bodySummary').innerHTML=`
      <div class="summary-item">
        <small>현재 체중</small>
        <strong>-</strong>
      </div>
      <div class="summary-item">
        <small>골격근량</small>
        <strong>-</strong>
      </div>
      <div class="summary-item">
        <small>체지방률</small>
        <strong>-</strong>
      </div>
    `;

    $('bodyChanges').textContent='아직 저장된 기록이 없습니다.';
    $('bodyGoalBar').style.width='0%';
    $('bodyGoalText').textContent=
      '기록을 입력하면 목표 진행률이 표시됩니다.';

    return;
  }

  const latest=bodyRecords[0];
  const previousRecord=bodyRecords[1];
  const first=bodyRecords[bodyRecords.length-1];

  $('bodySummary').innerHTML=`
    <div class="summary-item">
      <small>현재 체중</small>
      <strong>${displayNumber(latest.weight_kg)}kg</strong>
    </div>

    <div class="summary-item">
      <small>골격근량</small>
      <strong>${
        latest.skeletal_muscle_kg==null
          ? '-'
          : displayNumber(latest.skeletal_muscle_kg)+'kg'
      }</strong>
    </div>

    <div class="summary-item">
      <small>체지방률</small>
      <strong>${
        latest.body_fat_percent==null
          ? '-'
          : displayNumber(latest.body_fat_percent)+'%'
      }</strong>
    </div>
  `;

  if(previousRecord){
    $('bodyChanges').innerHTML=`
      <strong>직전 측정 대비</strong><br>
      체중 ${changeText(latest.weight_kg,previousRecord.weight_kg,'kg')} ·
      골격근량 ${changeText(
        latest.skeletal_muscle_kg,
        previousRecord.skeletal_muscle_kg,
        'kg'
      )} ·
      체지방률 ${changeText(
        latest.body_fat_percent,
        previousRecord.body_fat_percent,
        '%'
      )}
      <br><br>

      <strong>최초 측정 대비</strong><br>
      체중 ${changeText(latest.weight_kg,first.weight_kg,'kg')} ·
      골격근량 ${changeText(
        latest.skeletal_muscle_kg,
        first.skeletal_muscle_kg,
        'kg'
      )} ·
      체지방률 ${changeText(
        latest.body_fat_percent,
        first.body_fat_percent,
        '%'
      )}
    `;
  }else{
    $('bodyChanges').textContent=
      '첫 기록입니다. 다음 측정부터 변화량이 표시됩니다.';
  }

  const targetWeight=68;
  const startWeight=Number(first.weight_kg);
  const currentWeight=Number(latest.weight_kg);

  let goalPercent;

  if(startWeight>=targetWeight){
    goalPercent=currentWeight>=targetWeight?100:0;
  }else{
    goalPercent=
      ((currentWeight-startWeight)/(targetWeight-startWeight))*100;
  }

  goalPercent=Math.max(0,Math.min(100,goalPercent));

  $('bodyGoalBar').style.width=goalPercent+'%';

  const gained=currentWeight-startWeight;
  const remaining=Math.max(0,targetWeight-currentWeight);

  $('bodyGoalText').textContent=
    `현재 ${currentWeight.toFixed(1)}kg · `+
    `시작 대비 ${gained>=0?'+':''}${gained.toFixed(1)}kg · `+
    `목표까지 ${remaining.toFixed(1)}kg · `+
    `${Math.round(goalPercent)}%`;

  list.innerHTML=bodyRecords.map(record=>`
    <div class="body-record">
      <strong>${escapeHtml(record.measured_date)}</strong>

      <div style="margin-top:8px;line-height:1.7">
        체중 ${displayNumber(record.weight_kg)}kg ·
        골격근량 ${
          record.skeletal_muscle_kg==null
            ? '-'
            : displayNumber(record.skeletal_muscle_kg)+'kg'
        } ·
        체지방률 ${
          record.body_fat_percent==null
            ? '-'
            : displayNumber(record.body_fat_percent)+'%'
        }
      </div>

      ${
        record.memo
          ? `<div style="margin-top:6px;color:#6e6e73">
              ${escapeHtml(record.memo)}
            </div>`
          : ''
      }

      <div class="record-actions">
        <button
          class="secondary body-edit"
          data-id="${record.id}"
          style="border:0;border-radius:11px;padding:10px;font-weight:700"
        >
          수정
        </button>

        <button
          class="secondary body-delete"
          data-id="${record.id}"
          style="border:0;border-radius:11px;padding:10px;font-weight:700"
        >
          삭제
        </button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.body-edit').forEach(button=>{
    button.onclick=()=>{
      const record=bodyRecords.find(x=>x.id===button.dataset.id);
      if(record) fillBodyForm(record);
    };
  });

  list.querySelectorAll('.body-delete').forEach(button=>{
    button.onclick=async()=>{
      const record=bodyRecords.find(x=>x.id===button.dataset.id);

      if(!record) return;

      if(!confirm(`${record.measured_date} 기록을 삭제할까요?`)){
        return;
      }

      try{
        await DB.deleteBodyRecord(record.id);
        bodyRecords=await DB.loadBodyRecords();
        renderBodyRecords();
        resetBodyForm();
        $('bodySaveStatus').textContent='기록을 삭제했습니다.';
      }catch(error){
        console.error(error);
        alert('기록 삭제에 실패했습니다.\n'+error.message);
      }
    };
  });
}

async function openBodyPage(){
  $('workoutNav').classList.remove('on');
  $('bodyNav').classList.add('on');

  show('bodyPage');

  if(!$('bodyDate').value){
    $('bodyDate').value=localToday();
  }

  $('bodyRecordList').textContent='기록을 불러오는 중…';

  try{
    bodyRecords=await DB.loadBodyRecords();
    renderBodyRecords();
  }catch(error){
    console.error(error);
    $('bodyRecordList').textContent=
      '기록을 불러오지 못했습니다. '+error.message;
  }
}
function schedule(){clearTimeout(timer);timer=setTimeout(async()=>{try{await DB.saveDraft(draft);$('status').textContent='온라인 저장됨 · '+new Date().toLocaleTimeString('ko-KR')}catch(e){$('status').textContent='온라인 저장 실패 · 기기에 임시 저장됨'}},400)}
function renderWorkout(){
  const dayInfo = WORKOUT_DAY_INFO[draft.day];
$('title').textContent = dayInfo.title;$('duration').value=draft.duration||40;$('memo').value=draft.memo||'';$('list').innerHTML='';
  WORKOUT_CATALOG[draft.day].forEach((name,i)=>{
    const key=getExerciseKey(draft.day, i),e=draft.entries[key],p=previous[key],noWeight=['데드버그','팔로프 프레스'].includes(name);
    const c=document.createElement('div');c.className='exercise'+(e.done?' done':'');
    c.innerHTML=`<h3>${name}</h3><div class="row"><div class="field">지난 중량<br><strong>${p===undefined?'첫 기록':p+' kg'}</strong></div>
    <div class="field">오늘 중량<br>${noWeight?'중량 없음':`<div class="weight"><input class="w" type="number" step="0.5" value="${e.weight}"><span>kg</span></div>`}</div></div>
    <div class="actions"><button class="secondary">운동 설명</button><button class="btn donebtn">${e.done?'완료됨 ✓':'완료'}</button></div>`;
    const input=c.querySelector('.w');if(input)input.oninput=()=>{e.weight=input.value;schedule()};
    c.querySelector('.donebtn').onclick=()=>{if(!noWeight&&(!input||input.value==='')){alert('오늘 중량을 입력해 주세요.');return}e.weight=input?input.value:'';e.done=!e.done;schedule();renderWorkout()};
    $('list').appendChild(c);
  });
  const vals=Object.values(draft.entries),n=vals.filter(x=>x.done).length,p=Math.round(n*100/vals.length);$('bar').style.width=p+'%';$('count').textContent=n+' / '+vals.length+' · '+p+'%';
}
  $('workoutNav').onclick=()=>{
  $('workoutNav').classList.add('on');
  $('bodyNav').classList.remove('on');

  renderHome();
  show('home');
};

$('bodyNav').onclick=()=>{
  openBodyPage();
};

$('cancelBodyEdit').onclick=()=>{
  resetBodyForm();
  $('bodySaveStatus').textContent='수정을 취소했습니다.';
};

$('saveBody').onclick=async()=>{
  const date=bodyValue('bodyDate');
  const weight=bodyValue('bodyWeight');
  const button=$('saveBody');
  const saveStatus=$('bodySaveStatus');

  if(!date){
    alert('측정일을 입력해 주세요.');
    return;
  }

  if(!weight||Number(weight)<=0){
    alert('체중을 정확하게 입력해 주세요.');
    return;
  }

  button.disabled=true;
  saveStatus.textContent='인바디 기록 저장 중…';

  try{
    await DB.saveBodyRecord({
      measured_date:date,
      weight_kg:weight,
      skeletal_muscle_kg:bodyValue('bodyMuscle'),
      body_fat_percent:bodyValue('bodyFatPercent'),
      body_fat_mass_kg:bodyValue('bodyFatMass'),
      bmi:bodyValue('bodyBmi'),
      visceral_fat_level:bodyValue('bodyVisceralFat'),
      waist_hip_ratio:bodyValue('bodyWaistHip'),
      memo:bodyValue('bodyMemo')
    });

    bodyRecords=await DB.loadBodyRecords();
    renderBodyRecords();
    resetBodyForm();

    saveStatus.textContent='인바디 기록이 온라인에 저장되었습니다.';
  }catch(error){
    console.error(error);

    saveStatus.textContent=
      '저장 실패 · '+error.message;

    alert(
      '인바디 기록 저장에 실패했습니다.\n'+
      error.message
    );
  }finally{
    button.disabled=false;
  }
};
$('start').onclick=async()=>{draft=await DB.getOrCreateDraft(selected);previous=await DB.previousWeights(selected,draft.date);renderWorkout();show('workout')};
$('duration').oninput=()=>{draft.duration=$('duration').value;schedule()};$('memo').oninput=()=>{draft.memo=$('memo').value;schedule()};
$('finish').onclick=async()=>{const missing=Object.values(draft.entries).filter(x=>!x.done).length;if(missing&&!confirm('미완료 운동이 '+missing+'개 있습니다. 종료할까요?'))return;
const s=await DB.complete(draft);$('results').innerHTML=WORKOUT_CATALOG[s.day].map((name,i)=>{const key=getExerciseKey(s.day, i),e=s.entries[key],p=previous[key];let ch=!e.done?'미수행':p===undefined?'첫 기록':((Number(e.weight)-p)>=0?'+':'')+(Number(e.weight)-p)+' kg';return`<div style="padding:10px 0;border-bottom:1px solid #eee"><strong>${name}</strong><div>${ch}</div></div>`}).join('');show('result')};
$('back').onclick=()=>{selected=draft.day===4?1:draft.day+1;renderHome();show('home')};
$('linkEmailButton').onclick = async () => {
  const email = $('linkEmailInput').value.trim();
  const status = $('emailLinkStatus');
  const button = $('linkEmailButton');

  if(!email){
    alert('이메일 주소를 입력해 주세요.');
    return;
  }

  button.disabled = true;
  status.textContent = '이메일 연결 요청 중…';

  try{
    await DB.linkEmail(email);

    status.textContent =
      '확인 이메일을 보냈습니다. 메일에서 확인 링크를 눌러 주세요.';

    alert(
      '이메일을 확인해 주세요.\n' +
      '확인 링크를 누르면 현재 운동 기록과 이메일 계정이 연결됩니다.'
    );
  }catch(error){
    console.error(error);

    status.textContent =
      '이메일 연결 실패 · ' + error.message;

    alert(
      '이메일 연결에 실패했습니다.\n' +
      error.message
    );
  }finally{
    button.disabled = false;
  }
};
  (async()=>{try{await DB.init();$('status').textContent='온라인 연결됨';renderHome()}catch(e){$('status').textContent='연결 실패 · '+e.message;alert('Supabase에서 Anonymous Sign-Ins 활성화와 SQL 실행 여부를 확인해 주세요.')}})();
